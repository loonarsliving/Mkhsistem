name: CI

on:
  push:
    branches: [main, "claude/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Public, non-secret project config. The anon key is designed to be shipped
# to every browser (it ships in the client bundle) — it is not sensitive.
env:
  NEXT_PUBLIC_SUPABASE_URL: https://svcmybsziaelwwdrnzcv.supabase.co
  NEXT_PUBLIC_SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InN2Y215YnN6aWFlbHd3ZHJuemN2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODEyODExNzEsImV4cCI6MjA5Njg1NzE3MX0.Ds4cdAthZndisUoB4CRq1Ckc4F59TKE_n1QjxlfDEiA
  NEXT_PUBLIC_APP_URL: http://127.0.0.1:3100

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------
  # Determines whether the live-Supabase test-account secrets are
  # configured, so integration/e2e can skip cleanly instead of failing
  # every run until an admin adds them (see tests/integration/README.md).
  # ---------------------------------------------------------------------
  check-secrets:
    runs-on: ubuntu-latest
    outputs:
      has_test_creds: ${{ steps.check.outputs.has_test_creds }}
    steps:
      - id: check
        env:
          TEST_STAFF_EMAIL: ${{ secrets.TEST_STAFF_EMAIL }}
          TEST_STAFF_PASSWORD: ${{ secrets.TEST_STAFF_PASSWORD }}
          TEST_HR_EMAIL: ${{ secrets.TEST_HR_EMAIL }}
          TEST_HR_PASSWORD: ${{ secrets.TEST_HR_PASSWORD }}
        run: |
          if [ -n "$TEST_STAFF_EMAIL" ] && [ -n "$TEST_STAFF_PASSWORD" ] && [ -n "$TEST_HR_EMAIL" ] && [ -n "$TEST_HR_PASSWORD" ]; then
            echo "has_test_creds=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_test_creds=false" >> "$GITHUB_OUTPUT"
            echo "::warning::TEST_STAFF_EMAIL/PASSWORD and TEST_HR_EMAIL/PASSWORD secrets are not set — integration and e2e jobs will be skipped. See tests/integration/README.md."
          fi

  lint-and-typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: "npm"
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck

  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: "npm"
      - run: npm ci
      - run: npm run test:coverage
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unit-test-coverage
          path: coverage/
          retention-days: 14

  build:
    runs-on: ubuntu-latest
    needs: [lint-and-typecheck]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: "npm"
      - run: npm ci
      - run: npm run build
        env:
          SUPABASE_SERVICE_ROLE_KEY: build-time-placeholder-not-used-client-side
      - uses: actions/upload-artifact@v4
        with:
          name: next-build
          path: .next/
          retention-days: 3
          include-hidden-files: true

  integration-tests:
    runs-on: ubuntu-latest
    needs: [check-secrets, lint-and-typecheck]
    if: needs.check-secrets.outputs.has_test_creds == 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: "npm"
      - run: npm ci
      - run: npm run test:integration
        env:
          TEST_STAFF_EMAIL: ${{ secrets.TEST_STAFF_EMAIL }}
          TEST_STAFF_PASSWORD: ${{ secrets.TEST_STAFF_PASSWORD }}
          TEST_HR_EMAIL: ${{ secrets.TEST_HR_EMAIL }}
          TEST_HR_PASSWORD: ${{ secrets.TEST_HR_PASSWORD }}

  e2e-tests:
    runs-on: ubuntu-latest
    # Sequential after integration-tests: both suites drive the same test
    # account's attendance record, and running them concurrently would
    # race on the one-check-in-per-day constraint.
    needs: [check-secrets, integration-tests, build]
    if: needs.check-secrets.outputs.has_test_creds == 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: "npm"
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
        env:
          CI: true
          TEST_STAFF_EMAIL: ${{ secrets.TEST_STAFF_EMAIL }}
          TEST_STAFF_PASSWORD: ${{ secrets.TEST_STAFF_PASSWORD }}
          TEST_HR_EMAIL: ${{ secrets.TEST_HR_EMAIL }}
          TEST_HR_PASSWORD: ${{ secrets.TEST_HR_PASSWORD }}
          SUPABASE_SERVICE_ROLE_KEY: e2e-placeholder-not-used-client-side
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

  security-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: "npm"
      - run: npm ci
      - name: Dependency audit (high/critical only)
        run: npm audit --audit-level=high
