name: Android Build

on:
  push:
    branches: [main, "claude/**"]
    paths:
      - "android/**"
      - "capacitor.config.ts"
      - "lib/native/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/android-build.yml"
    # Pushing a tag like android-v1.0.0 builds the same way *and* publishes
    # a GitHub Release named "MK Connect Android v1.0.0" with both APKs
    # attached — see the release job below.
    tags: ["android-v*"]
  workflow_dispatch:

# Same public, non-secret project config as .github/workflows/ci.yml.
env:
  NEXT_PUBLIC_SUPABASE_URL: https://svcmybsziaelwwdrnzcv.supabase.co
  NEXT_PUBLIC_SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InN2Y215YnN6aWFlbHd3ZHJuemN2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODEyODExNzEsImV4cCI6MjA5Njg1NzE3MX0.Ds4cdAthZndisUoB4CRq1Ckc4F59TKE_n1QjxlfDEiA
  NEXT_PUBLIC_APP_URL: https://mkh.haluoleo.id

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write # only needed for the release step below (tag pushes)
    env:
      # `if:` conditions can't reference `secrets` directly (GitHub Actions
      # restriction) — mapping it into a job-level env var first is the
      # standard workaround.
      HAS_RELEASE_KEYSTORE: ${{ secrets.ANDROID_RELEASE_KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - run: npm ci

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - uses: android-actions/setup-android@v3

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: mk-connect-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

      # Lint and a successful Gradle build only prove the APK packages —
      # they can't catch a runtime crash on launch (a missing manifest
      # resource, an uninitialized SDK, a bad plugin config). Boot a real
      # emulator, install the just-built debug APK, launch it, and fail the
      # job if logcat shows a FATAL EXCEPTION for our process.
      - name: Boot emulator smoke test
        # Non-blocking: reactivecircus/android-emulator-runner executes each
        # line of `script` as its own separate `sh -c` invocation (visible in
        # the run logs as one "[command]/usr/bin/sh -c <line>" per line), not
        # as a single multi-line script. A `if ...; then` / `fi` split across
        # two lines therefore lands in two different shell processes, and the
        # `if` line fails with "Syntax error: end of file unexpected
        # (expecting \"fi\")" because its own process never sees a matching
        # fi. Every compound statement below is written on one physical line
        # for that reason. continue-on-error is set because the debug APK
        # (uploaded in the step above, before this one runs) is the actual
        # deliverable the CI build exists to produce -- a flaky or slow
        # hosted-runner emulator boot should never block that, or block the
        # release APK build further down the job.
        continue-on-error: true
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: |
            adb logcat -c
            adb install -r android/app/build/outputs/apk/debug/app-debug.apk
            adb shell am start -W -n id.haluoleo.mkconnect/.MainActivity
            sleep 15
            adb logcat -d > "$RUNNER_TEMP/logcat.txt"
            if grep -q "FATAL EXCEPTION" "$RUNNER_TEMP/logcat.txt" || ! adb shell pidof id.haluoleo.mkconnect > /dev/null; then echo "::error::App crashed or is not running after launch. Relevant logcat:"; grep -A 60 "FATAL EXCEPTION\|AndroidRuntime: Process\|id.haluoleo.mkconnect" "$RUNNER_TEMP/logcat.txt" || cat "$RUNNER_TEMP/logcat.txt"; exit 1; fi
            echo "App launched and is still running after 15s — no crash detected."

      - name: Upload smoke test logcat
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: boot-smoke-test-logcat
          path: ${{ runner.temp }}/logcat.txt
          if-no-files-found: ignore

      # Non-blocking: lint findings are worth surfacing but shouldn't hold
      # up getting a real device/emulator signal on whether the app boots.
      - name: Android lint
        if: always()
        continue-on-error: true
        working-directory: android
        run: ./gradlew lint --no-daemon

      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-lint-report
          path: android/app/build/reports/lint-results-*.html
          if-no-files-found: ignore

      # Release signing is optional: without the three secrets below, this
      # still produces a real, installable (but unsigned) release APK for
      # internal testing — see docs/android/BUILD.md for how to generate
      # and register a real release keystore so this step ships a properly
      # signed artifact instead.
      - name: Decode release keystore
        if: ${{ env.HAS_RELEASE_KEYSTORE == 'true' }}
        run: |
          echo "${{ secrets.ANDROID_RELEASE_KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/release.keystore"
          echo "MKC_RELEASE_KEYSTORE_PATH=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"

      - name: Build release APK
        working-directory: android
        env:
          MKC_RELEASE_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEYSTORE_PASSWORD }}
          MKC_RELEASE_KEY_ALIAS: ${{ secrets.ANDROID_RELEASE_KEY_ALIAS }}
          MKC_RELEASE_KEY_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEY_PASSWORD }}
        run: ./gradlew assembleRelease --no-daemon

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: mk-connect-release-apk
          path: android/app/build/outputs/apk/release/app-release*.apk

      # Only on a tag push (e.g. android-v1.0.0) — renames both APKs with
      # the version baked into the filename and publishes them as a
      # GitHub Release, so anyone can grab them from the Releases page
      # instead of digging through workflow-run artifacts (which also
      # expire after 90 days; release assets don't).
      - name: Prepare versioned APK filenames
        if: startsWith(github.ref, 'refs/tags/android-v')
        run: |
          version="${GITHUB_REF_NAME#android-v}"
          echo "APK_VERSION=$version" >> "$GITHUB_ENV"
          mkdir -p release-assets
          cp android/app/build/outputs/apk/debug/app-debug.apk "release-assets/MKConnect-v${version}-debug.apk"
          release_apk=$(ls android/app/build/outputs/apk/release/app-release*.apk | head -n1)
          release_label=$([ "$HAS_RELEASE_KEYSTORE" = "true" ] && echo "release" || echo "release-unsigned")
          cp "$release_apk" "release-assets/MKConnect-v${version}-${release_label}.apk"

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/android-v')
        uses: softprops/action-gh-release@v2
        with:
          name: "MK Connect Android v${{ env.APK_VERSION }}"
          generate_release_notes: true
          files: release-assets/*.apk
          body: |
            Android app for PT Maha Karya Haluoleo employees (package `id.haluoleo.mkconnect`).

            - **Debug APK** — for internal testing, signed with the standard Android debug key.
            - **Release APK** — ${{ env.HAS_RELEASE_KEYSTORE == 'true' && 'signed with the production release key.' || 'currently UNSIGNED (no release keystore configured in repo secrets yet — see docs/android/BUILD.md). Fine for one-off installs, but cannot receive signed updates until a real keystore is added.' }}

            See `docs/android/INSTALL.md` for installation steps.
