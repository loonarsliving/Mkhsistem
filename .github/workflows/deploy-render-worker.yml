name: Deploy render worker to Cloudflare

on:
  push:
    branches:
      - claude/resume-session-grdt5h
    paths:
      - "worker/**"
      - "scripts/render-worker-server.ts"
      - "lib/kontenai/render-job-processor.ts"
      - "Dockerfile.render-worker-container"
      - "wrangler.jsonc"
      - ".github/workflows/deploy-render-worker.yml"
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
